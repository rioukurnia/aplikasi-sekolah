<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Administrasi Kelas SPA</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- SheetJS untuk Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        
        /* Animasi Transisi */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Scanner Animasi */
        .scan-line { width: 100%; height: 2px; background: #22c55e; position: absolute; top: 0; box-shadow: 0 0 10px #22c55e; animation: scan 2s linear infinite; }
        @keyframes scan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }

        /* Sembunyikan elemen saat dicetak dan Perbaikan Fitur Cetak (Print) */
        @media print {
            .print-hidden { display: none !important; }
            body, html { background: white !important; margin: 0 !important; padding: 0 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; height: auto !important; overflow: visible !important; }
            
            /* Menghapus batasan scroll & tinggi layar agar dokumen bisa dicetak berlembar-lembar */
            .h-screen { height: auto !important; min-height: 100% !important; }
            .overflow-hidden, .overflow-y-auto, .overflow-x-auto { overflow: visible !important; }
            
            .print-w-full { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
            .print-border-black, .print-border-black th, .print-border-black td { border: 1px solid black !important; }
            .break-inside-avoid { break-inside: avoid !important; page-break-inside: avoid !important; }
            
            @page { margin: 10mm; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, createContext, useContext, useRef } = React;

        // --- KONFIGURASI TEMA ---
        const themes = {
            blue: { bg: 'bg-blue-600', hover: 'hover:bg-blue-700', text: 'text-blue-600', sidebar: 'bg-slate-900', border: 'border-blue-500' },
            emerald: { bg: 'bg-emerald-600', hover: 'hover:bg-emerald-700', text: 'text-emerald-600', sidebar: 'bg-emerald-950', border: 'border-emerald-500' },
            indigo: { bg: 'bg-indigo-600', hover: 'hover:bg-indigo-700', text: 'text-indigo-600', sidebar: 'bg-indigo-950', border: 'border-indigo-500' },
            rose: { bg: 'bg-rose-600', hover: 'hover:bg-rose-700', text: 'text-rose-600', sidebar: 'bg-rose-950', border: 'border-rose-500' },
        };

        const initialDataTemplate = {
            students: [], absensi: {}, leger: {}, legerCols: null, jadwal: { times: ['07:00-07:45', '07:45-08:30', '08:30-09:15', '09:15-09:45 (Istirahat)', '09:45-10:30', '10:30-11:15', '11:15-12:00'] }, ekskul: [], kokurikuler: [], homevisit: [], kontak: [], tugas: [], perangkat: []
        };

        const AppContext = createContext();
        
        // --- HELPER UNTUK GOOGLE DRIVE IMAGE ---
        const parseImageUrl = (url) => {
            if (!url) return '';
            const driveRegex = /(?:file\/d\/|id=)([a-zA-Z0-9_-]+)/;
            const match = url.match(driveRegex);
            if (match && match[1]) {
                return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
            }
            return url;
        };

        // --- MODAL / DIALOG COMPONENT ---
        function DialogBox({ isOpen, title, message, onConfirm, onCancel, type = 'alert' }) {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 fade-in print-hidden">
                    <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl">
                        <div className={`p-4 ${type === 'confirm' ? 'bg-amber-500' : 'bg-blue-600'} text-white flex items-center gap-3`}>
                            <i className={`fa-solid ${type === 'confirm' ? 'fa-triangle-exclamation' : 'fa-circle-info'} text-xl`}></i>
                            <h3 className="font-bold text-lg">{title}</h3>
                        </div>
                        <div className="p-6">
                            <p className="text-gray-700 whitespace-pre-wrap">{message}</p>
                        </div>
                        <div className="bg-gray-50 p-4 flex justify-end gap-3 border-t">
                            {type === 'confirm' && (
                                <button onClick={onCancel} className="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded-xl font-medium transition">Batal</button>
                            )}
                            <button onClick={onConfirm} className={`px-4 py-2 text-white rounded-xl font-medium transition ${type === 'confirm' ? 'bg-amber-600 hover:bg-amber-700' : 'bg-blue-600 hover:bg-blue-700'}`}>
                                {type === 'confirm' ? 'Ya, Lanjutkan' : 'Mengerti'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- KOMPONEN TOMBOL EXCEL ---
        function ExcelButtons({ onExport, onImport, currentTheme }) {
            const id = Math.random().toString(36).substring(7);
            return (
                <div className="flex gap-2 print-hidden">
                    <button onClick={onExport} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition flex items-center gap-2">
                        <i className="fa-solid fa-download"></i> Export (.xlsx)
                    </button>
                    <button onClick={() => document.getElementById(`file-upload-${id}`).click()} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition flex items-center gap-2">
                        <i className="fa-solid fa-upload"></i> Import (.xlsx)
                    </button>
                    <input type="file" id={`file-upload-${id}`} accept=".xlsx, .xls" className="hidden" onChange={onImport} />
                </div>
            );
        }

        // --- APLIKASI UTAMA ---
        function App() {
            const [currentUser, setCurrentUser] = useState(null);
            const [appData, setAppData] = useState({ users: [], db: {}, settings: { theme: 'blue', logo: '', schoolName: 'AdminKelas' } });
            const [activeTab, setActiveTab] = useState('dashboard');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [viewTeacher, setViewTeacher] = useState('');
            const [viewClass, setViewClass] = useState('');

            const [dialog, setDialog] = useState({ isOpen: false, title: '', message: '', type: 'alert', onConfirm: null });

            const showToast = (message, title = "Informasi") => {
                setDialog({ isOpen: true, title, message, type: 'alert', onConfirm: () => setDialog(prev => Object.assign({}, prev, {isOpen: false})) });
            };

            const showConfirm = (message, onConfirmAction) => {
                setDialog({
                    isOpen: true, title: "Konfirmasi", message, type: 'confirm',
                    onConfirm: () => { onConfirmAction(); setDialog(prev => Object.assign({}, prev, {isOpen: false})); },
                    onCancel: () => setDialog(prev => Object.assign({}, prev, {isOpen: false}))
                });
            };

            useEffect(() => {
                const saved = localStorage.getItem('adminKelasSystemV3');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (!parsed.settings) parsed.settings = { theme: 'blue', logo: '', schoolName: 'AdminKelas' };
                    if (!parsed.users || !Array.isArray(parsed.users) || parsed.users.length === 0) {
                        parsed.users = [{ username: 'admin', password: 'admin123', role: 'admin' }];
                    } else {
                        const adminIdx = parsed.users.findIndex(u => u.role === 'admin');
                        if (adminIdx === -1) {
                            parsed.users.push({ username: 'admin', password: 'admin123', role: 'admin' });
                        } else {
                            parsed.users[adminIdx].password = 'admin123';
                        }
                    }
                    if (!parsed.db) parsed.db = {};
                    setAppData(parsed);
                } else {
                    setAppData({
                        users: [{ username: 'admin', password: 'admin123', role: 'admin' }],
                        db: {}, settings: { theme: 'blue', logo: '', schoolName: 'Sistem Admin' }
                    });
                }
                const session = sessionStorage.getItem('currentUserV3');
                if (session) {
                    const user = JSON.parse(session);
                    setCurrentUser(user);
                    if (user.role === 'guru' || user.role === 'guru_mapel') {
                        setViewTeacher(user.username);
                    }
                }
            }, []);

            useEffect(() => {
                if (appData.users.length > 0) {
                    localStorage.setItem('adminKelasSystemV3', JSON.stringify(appData));
                }
            }, [appData]);

            useEffect(() => { setViewClass(''); }, [viewTeacher]);

            const getCombinedData = () => {
                let displayedRoleTemp = currentUser?.role;
                if (currentUser?.role === 'admin' && viewTeacher) {
                    const vt = appData.users.find(u => u.username === viewTeacher);
                    if (vt) displayedRoleTemp = vt.role;
                }

                if (!viewTeacher) return initialDataTemplate;
                const mainDb = appData.db[viewTeacher] || initialDataTemplate;

                if (displayedRoleTemp === 'guru_mapel' && viewClass) {
                    const classDb = appData.db[viewClass] || initialDataTemplate;
                    return Object.assign({}, classDb, {
                        leger: mainDb[`leger_${viewClass}`] || {},
                        legerCols: mainDb[`legerCols_${viewClass}`] || null,
                    });
                }
                return mainDb;
            };

            const integrateLegerToWaliKelas = (dbCopy, mapelUsername, className, mapelLeger, mapelCols) => {
                const wkLeger = Object.assign({}, dbCopy[className].leger || {});
                let wkLegerCols = dbCopy[className].legerCols || ['MTK', 'IPA', 'IPS', 'B.IND', 'B.ING', 'PKN', 'AGAMA'];
                
                if (!wkLegerCols.includes(mapelUsername)) {
                    wkLegerCols = [...wkLegerCols, mapelUsername];
                    dbCopy[className].legerCols = wkLegerCols;
                }
                
                const colsToUse = mapelCols || ['Tugas 1', 'Tugas 2', 'UH 1', 'UTS', 'UAS'];
                
                Object.keys(mapelLeger).forEach(studentId => {
                    if (!wkLeger[studentId]) wkLeger[studentId] = {};
                    let total = 0, count = 0;
                    colsToUse.forEach(c => {
                        if (mapelLeger[studentId][c] !== undefined && mapelLeger[studentId][c] !== '' && !isNaN(mapelLeger[studentId][c])) {
                            total += Number(mapelLeger[studentId][c]);
                            count++;
                        }
                    });
                    wkLeger[studentId][mapelUsername] = count > 0 ? Math.round(total / count) : '';
                });
                dbCopy[className].leger = wkLeger;
            };

            const updateCombinedData = (key, newData) => {
                if (!viewTeacher) return;
                
                let displayedRoleTemp = currentUser?.role;
                if (currentUser?.role === 'admin' && viewTeacher) {
                    const vt = appData.users.find(u => u.username === viewTeacher);
                    if (vt) displayedRoleTemp = vt.role;
                }

                setAppData(prev => {
                    const dbCopy = Object.assign({}, prev.db);
                    const isMapel = displayedRoleTemp === 'guru_mapel' && viewClass;
                    
                    if (isMapel) {
                        if (!dbCopy[viewClass]) dbCopy[viewClass] = Object.assign({}, initialDataTemplate);
                        if (!dbCopy[viewTeacher]) dbCopy[viewTeacher] = Object.assign({}, initialDataTemplate);

                        if (key === 'leger' || key === 'legerCols') {
                            dbCopy[viewTeacher][`${key}_${viewClass}`] = newData;
                            
                            const mapelUser = prev.users.find(u => u.username === (currentUser.role === 'admin' ? viewTeacher : currentUser.username));
                            const mapelName = mapelUser && mapelUser.mapelName ? mapelUser.mapelName : (currentUser.role === 'admin' ? viewTeacher : currentUser.username);
                            
                            const mapelLeger = key === 'leger' ? newData : (dbCopy[viewTeacher][`leger_${viewClass}`] || {});
                            const mapelCols = key === 'legerCols' ? newData : (dbCopy[viewTeacher][`legerCols_${viewClass}`] || ['Tugas 1', 'Tugas 2', 'UH 1', 'UTS', 'UAS']);
                            
                            integrateLegerToWaliKelas(dbCopy, mapelName, viewClass, mapelLeger, mapelCols);
                        } else {
                            dbCopy[viewClass][key] = newData;
                        }
                    } else {
                        if (!dbCopy[viewTeacher]) dbCopy[viewTeacher] = Object.assign({}, initialDataTemplate);
                        dbCopy[viewTeacher][key] = newData;
                    }
                    return Object.assign({}, prev, { db: dbCopy });
                });
            };

            const updateSettings = (newSettings) => {
                setAppData(prev => Object.assign({}, prev, { settings: Object.assign({}, prev.settings, newSettings) }));
            };

            const deleteUser = (username) => {
                showConfirm(`Yakin menghapus akun "${username}"? Semua data kelas dan nilai miliknya akan ikut terhapus dari sistem.`, () => {
                    setAppData(prev => {
                        const newUsers = prev.users.filter(u => u.username !== username);
                        const newDb = Object.assign({}, prev.db);
                        delete newDb[username];
                        return Object.assign({}, prev, { users: newUsers, db: newDb });
                    });
                    if (viewTeacher === username) setViewTeacher('');
                    showToast(`Akun guru ${username} berhasil dihapus!`, "Sukses");
                });
            };

            const handleLogin = (user) => {
                setCurrentUser(user);
                sessionStorage.setItem('currentUserV3', JSON.stringify(user));
                if (user.role === 'guru' || user.role === 'guru_mapel') {
                    setViewTeacher(user.username);
                } else {
                    setViewTeacher('');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setViewTeacher('');
                sessionStorage.removeItem('currentUserV3');
            };

            if (!currentUser) return <LoginScreen appData={appData} setAppData={setAppData} onLogin={handleLogin} showToast={showToast} />;

            const currentTheme = themes[appData.settings.theme] || themes.blue;
            const combinedData = getCombinedData();

            let displayedRole = currentUser.role;
            if (currentUser.role === 'admin' && viewTeacher) {
                const vt = appData.users.find(u => u.username === viewTeacher);
                if (vt) displayedRole = vt.role;
            }

            const menuItems = [
                { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie', roles: ['admin', 'guru', 'guru_mapel'] },
                { id: 'siswa', label: 'Data & Foto Siswa', icon: 'fa-users', roles: ['admin', 'guru'] },
                { id: 'absensi', label: 'Rekap Absensi', icon: 'fa-clipboard-user', roles: ['admin', 'guru', 'guru_mapel'] },
                { id: 'leger', label: displayedRole === 'guru_mapel' ? 'Buku Nilai Mapel' : 'Leger Nilai', icon: 'fa-file-excel', roles: ['admin', 'guru', 'guru_mapel'] },
                { id: 'jadwal', label: 'Jadwal Pelajaran', icon: 'fa-calendar-days', roles: ['admin', 'guru', 'guru_mapel'] },
                { id: 'kokurikuler', label: 'Data Kokurikuler', icon: 'fa-book-open-reader', roles: ['admin', 'guru'] },
                { id: 'ekskul', label: 'Ekstrakurikuler', icon: 'fa-medal', roles: ['admin', 'guru'] },
                { id: 'homevisit', label: 'Home Visit', icon: 'fa-house-user', roles: ['admin', 'guru'] },
                { id: 'kontak', label: 'Kontak & Grup', icon: 'fa-address-book', roles: ['admin', 'guru'] },
                { id: 'tugas', label: 'Tugas & G-Drive', icon: 'fa-cloud-arrow-up', roles: ['admin', 'guru', 'guru_mapel'] },
                { id: 'perangkat', label: 'Perangkat & AI', icon: 'fa-book-bookmark', roles: ['admin', 'guru', 'guru_mapel'] },
                { id: 'pengaturan', label: 'Pengaturan Tema', icon: 'fa-gear', roles: ['admin', 'guru', 'guru_mapel'] },
            ].filter(m => m.roles.includes(displayedRole) || (currentUser.role === 'admin' && m.id === 'pengaturan'));

            const renderContent = () => {
                const props = {
                    data: combinedData,
                    updateData: updateCombinedData,
                    theme: currentTheme,
                    settings: appData.settings,
                    showToast, showConfirm
                };

                if (currentUser.role === 'admin' && !viewTeacher && activeTab !== 'pengaturan') {
                    return (
                        <div className="flex flex-col items-center justify-center h-64 text-slate-500 fade-in">
                            <i className="fa-solid fa-users-gear text-6xl mb-4 opacity-20"></i>
                            <h2 className="text-xl font-bold">Pilih Guru Terlebih Dahulu</h2>
                            <p>Gunakan dropdown di atas untuk melihat data spesifik guru.</p>
                        </div>
                    );
                }

                if (displayedRole === 'guru_mapel' && !viewClass && !['dashboard', 'pengaturan', 'canva', 'jadwal'].includes(activeTab)) {
                    return (
                        <div className="flex flex-col items-center justify-center h-64 text-slate-500 fade-in">
                            <i className="fa-solid fa-chalkboard-user text-6xl mb-4 opacity-20"></i>
                            <h2 className="text-xl font-bold">Pilih Kelas Terlebih Dahulu</h2>
                            <p>Gunakan dropdown "Kelas" di pojok kanan atas untuk memilih kelas yang akan dikelola nilainya.</p>
                        </div>
                    );
                }

                switch (activeTab) {
                    case 'dashboard': return <DashboardView data={combinedData} theme={currentTheme} />;
                    case 'siswa': return <DataSiswaView {...props} />;
                    case 'absensi': return <AbsensiView {...props} />;
                    case 'leger': return <LegerView {...props} activeRole={displayedRole} />;
                    case 'jadwal': return <JadwalView {...props} />;
                    case 'kokurikuler': return <KokurikulerView {...props} />;
                    case 'ekskul': return <EkskulView {...props} />;
                    case 'homevisit': return <HomeVisitView {...props} />;
                    case 'kontak': return <KontakView {...props} />;
                    case 'tugas': return <TugasView {...props} />;
                    case 'perangkat': return <PerangkatView {...props} />;
                    case 'pengaturan': return <PengaturanView appData={appData} updateSettings={updateSettings} theme={currentTheme} showToast={showToast} currentUser={currentUser} deleteUser={deleteUser} />;
                    default: return <DashboardView data={combinedData} theme={currentTheme} />;
                }
            };

            const activeMenu = menuItems.find(m => m.id === activeTab);

            return (
                <AppContext.Provider value={{ showToast, showConfirm }}>
                    <div className="flex print:block h-screen overflow-hidden text-slate-800 print:overflow-visible">
                        {/* Sidebar Overlay */}
                        {isSidebarOpen && (
                            <div className="fixed inset-0 bg-slate-900 bg-opacity-50 z-20 md:hidden print-hidden" onClick={() => setIsSidebarOpen(false)}></div>
                        )}

                        {/* Sidebar */}
                        <aside className={`fixed md:static inset-y-0 left-0 z-30 w-72 ${currentTheme.sidebar} text-white transform transition-transform duration-300 ease-in-out ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'} flex flex-col print-hidden shadow-2xl`}>
                            <div className="flex items-center gap-3 h-20 px-6 bg-black/20 flex-shrink-0">
                                {appData.settings.logo ? (
                                    <img src={parseImageUrl(appData.settings.logo)} className="h-10 w-10 object-cover bg-white rounded-lg p-1" />
                                ) : (
                                    <div className={`w-10 h-10 rounded-xl ${currentTheme.bg} flex items-center justify-center`}><i className="fa-solid fa-graduation-cap text-xl"></i></div>
                                )}
                                <span className="font-bold text-lg truncate flex-1 leading-tight">{appData.settings.schoolName}</span>
                                <button className="md:hidden text-white/50 hover:text-white" onClick={() => setIsSidebarOpen(false)}><i className="fa-solid fa-xmark text-xl"></i></button>
                            </div>
                            
                            <nav className="flex-1 overflow-y-auto py-4 px-3 space-y-1">
                                {menuItems.map(item => (
                                    <button key={item.id} onClick={() => { setActiveTab(item.id); setIsSidebarOpen(false); }}
                                        className={`w-full flex items-center gap-4 px-4 py-3 rounded-xl transition-all ${activeTab === item.id ? `${currentTheme.bg} text-white shadow-lg shadow-black/10` : 'text-slate-300 hover:bg-white/10 hover:text-white'}`}>
                                        <i className={`fa-solid ${item.icon} w-5 text-center ${activeTab === item.id ? 'text-white' : 'text-white/50'}`}></i>
                                        <span className="font-medium">{item.label}</span>
                                    </button>
                                ))}
                            </nav>

                            <div className="p-5 bg-black/20 mt-auto border-t border-white/5">
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center">
                                            <i className={`fa-solid ${currentUser.role === 'admin' ? 'fa-user-tie' : 'fa-chalkboard-user'} text-white/70`}></i>
                                        </div>
                                        <div className="text-left">
                                            <p className="text-sm font-bold text-white leading-none">{currentUser.username}</p>
                                            <p className="text-xs text-slate-400 mt-1 tracking-wider">{currentUser.role === 'guru_mapel' ? `MAPEL: ${currentUser.mapelName || currentUser.username}`.toUpperCase() : currentUser.role === 'guru' ? 'WALI KELAS' : 'SUPER ADMIN'}</p>
                                        </div>
                                    </div>
                                    <button onClick={handleLogout} className="w-10 h-10 flex items-center justify-center text-rose-400 hover:bg-rose-500 hover:text-white rounded-xl transition">
                                        <i className="fa-solid fa-arrow-right-from-bracket"></i>
                                    </button>
                                </div>
                            </div>
                        </aside>

                        {/* Main Content */}
                        <div className="flex-1 flex print:block flex-col min-w-0 print-w-full print:overflow-visible">
                            <header className="bg-white border-b h-20 flex items-center justify-between px-6 z-10 print-hidden shadow-sm">
                                <div className="flex items-center gap-4">
                                    <button className="md:hidden text-slate-500 hover:text-slate-800" onClick={() => setIsSidebarOpen(true)}>
                                        <i className="fa-solid fa-bars text-xl"></i>
                                    </button>
                                    <h1 className="text-2xl font-bold text-slate-800 hidden sm:block">
                                        {activeMenu ? activeMenu.label : 'Dashboard'}
                                    </h1>
                                </div>
                                
                                <div className="flex items-center gap-4">
                                    {currentUser.role === 'admin' && (
                                        <div className="flex items-center gap-2 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl">
                                            <span className="text-xs font-bold text-amber-700 hidden md:inline">Data Guru:</span>
                                            <select value={viewTeacher} onChange={e=>setViewTeacher(e.target.value)} className="bg-transparent text-sm font-bold text-amber-900 outline-none cursor-pointer">
                                                <option value="">-- Pilih Guru --</option>
                                                {appData.users.filter(u => u.role === 'guru' || u.role === 'guru_mapel').map(u => (
                                                    <option key={u.username} value={u.username}>{u.username} ({u.role === 'guru' ? 'Wali Kelas' : 'Guru Mapel'})</option>
                                                ))}
                                            </select>
                                        </div>
                                    )}
                                    {displayedRole === 'guru_mapel' && (
                                        <div className="flex items-center gap-2 bg-indigo-50 border border-indigo-200 px-3 py-1.5 rounded-xl">

        function LoginScreen({ appData, setAppData, onLogin, showToast }) {
            const [tab, setTab] = useState('login'); 
            const [form, setForm] = useState({ user: '', pass: '', pass2: '', tipe: 'guru', mapelName: '' });
            const [showPass, setShowPass] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (tab === 'login') {
                    if (form.user === 'admin' && form.pass === 'admin123') {
                        onLogin({ username: 'admin', password: 'admin123', role: 'admin' });
                        return;
                    }

                    const user = appData.users.find(u => u.username === form.user && u.password === form.pass);
                    if (user) onLogin(user);
                    else showToast('Username atau password salah! (Gunakan admin / admin123 untuk super admin)', 'Login Gagal');
                } else if (tab === 'forgot') {
                    if (form.pass !== form.pass2) return showToast('Konfirmasi password baru tidak cocok!', 'Gagal');
                    const userIdx = appData.users.findIndex(u => u.username === form.user);
                    if (userIdx !== -1) {
                        const newUsers = [...appData.users];
                        newUsers[userIdx].password = form.pass;
                        setAppData(prev => Object.assign({}, prev, { users: newUsers }));
                        showToast('Password berhasil direset! Silakan masuk dengan password baru.', 'Sukses');
                        setTab('login');
                        setForm(Object.assign({}, form, {pass: '', pass2: ''}));
                    } else {
                        showToast('Username tidak ditemukan di sistem!', 'Gagal');
                    }
                } else {
                    if (form.pass !== form.pass2) return showToast('Konfirmasi password tidak cocok!', 'Gagal');
                    if (appData.users.find(u => u.username === form.user)) return showToast('Username sudah terdaftar!', 'Gagal');
                    
                    const newUser = { username: form.user, password: form.pass, role: form.tipe, mapelName: form.tipe === 'guru_mapel' ? form.mapelName : '' };
                    setAppData(prev => Object.assign({}, prev, { users: [...prev.users, newUser] }));
                    showToast('Pendaftaran berhasil! Silakan masuk.', 'Sukses');
                    setTab('login');
                    setForm(Object.assign({}, form, {pass: '', pass2: '', tipe: 'guru', mapelName: ''}));
                }
            };

            return (

                        <div className="flex border-b">

        function DataSiswaView({ data, updateData, theme, settings, showToast, showConfirm }) {
            const [form, setForm] = useState({ nisn: '', nama: '', gender: 'L', urlFoto: '' });
            const [editId, setEditId] = useState(null);
            const [isPrintingCards, setIsPrintingCards] = useState(false);
            const { students } = data;

            const exportExcel = () => {
                const ws = XLSX.utils.json_to_sheet(students.map(s => ({ NISN: s.nisn, 'Nama Siswa': s.nama, 'L/P': s.gender, 'URL Foto': s.urlFoto || '' })));
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Siswa");
                XLSX.writeFile(wb, "Data_Siswa.xlsx");
            };

            const importExcel = (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, {type: 'binary'});
                    const rowData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    
                    const newStudents = rowData.map((d,i) => ({
                        id: Date.now().toString() + i,
                        nisn: d.NISN ? d.NISN.toString() : '',
                        nama: d['Nama Siswa'] || '',
                        gender: d['L/P'] || 'L',
                        urlFoto: d['URL Foto'] || ''
                    })).filter(s => s.nisn && s.nama);
                    
                    const merged = [...students];
                    newStudents.forEach(ns => {
                       const idx = merged.findIndex(s => s.nisn === ns.nisn);
                       if (idx >= 0) merged[idx] = Object.assign({}, merged[idx], ns);
                       else merged.push(ns);
                    });
                    
                    updateData('students', merged);
                    showToast("Data Siswa berhasil diunggah!", "Berhasil");
                };
                reader.readAsBinaryString(file); e.target.value = null;
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!form.nisn || !form.nama) return;
                if(editId) {
                    updateData('students', students.map(s => s.id === editId ? Object.assign({}, s, form) : s));

                    updateData('students', [...students, Object.assign({}, form, {id: Date.now().toString()})]);
