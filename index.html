        function AbsensiView({ data, updateData, theme, showToast }) {
            const { students, absensi } = data;
            const [dateStr, setDateStr] = useState(new Date().toISOString().split('T')[0]);
            const [showScanner, setShowScanner] = useState(false);
            const [scanInput, setScanInput] = useState('');
            const scanRef = useRef(null);

            const handleStatus = (id, st) => {
                const updated = Object.assign({}, absensi);
                if (!updated[dateStr]) updated[dateStr] = {};
                updated[dateStr][id] = st;
                updateData('absensi', updated);
            };

            const handleScan = (e) => {
                e.preventDefault();
                const target = students.find(s => s.nisn === scanInput);
                if (target) {
                    handleStatus(target.id, 'Hadir');
                    showToast(`✅ Berhasil! ${target.nama} Hadir.`, "Scan Berhasil");
                } else {
                    showToast('❌ NISN tidak ditemukan!', "Gagal");
                }
                setScanInput('');
                if (scanRef.current) scanRef.current.focus();
            };

            const exportAbsensi = (months) => {
                const end = new Date(); const start = new Date(); start.setMonth(start.getMonth() - months);
                const activeDates = Object.keys(absensi).filter(d => {
                    const dateObj = new Date(d); return dateObj >= start && dateObj <= end;
                }).sort();

                const exportData = students.map(s => {
                    const row = { NISN: s.nisn, 'Nama Siswa': s.nama };
                    let h=0, sk=0, i=0, a=0;
                    activeDates.forEach(d => {
                        const st = absensi[d] && absensi[d][s.id] ? absensi[d][s.id] : '-';
                        row[d] = st;
                        if(st==='Hadir') h++; else if(st==='Sakit') sk++; else if(st==='Izin') i++; else if(st==='Alpa') a++;
                    });
                    row['Total Hadir'] = h; row['Total Sakit'] = sk; row['Total Izin'] = i; row['Total Alpa'] = a;
                    return row;
                });
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Rekap");
                XLSX.writeFile(wb, `Rekap_Absensi_${months}_Bulan.xlsx`);
            };

            const importAbsensi = (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, {type: 'binary'});
                    const rowData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    const newAbs = Object.assign({}, absensi);
                    rowData.forEach(row => {
                        const std = students.find(s => s.nisn == row.NISN);
                        if(std) {
                            Object.keys(row).forEach(k => {
                                if (k.match(/^\d{4}-\d{2}-\d{2}$/)) {
                                    if(!newAbs[k]) newAbs[k] = {};
                                    newAbs[k][std.id] = row[k];
                                }
                            });
                        }
                    });
                    updateData('absensi', newAbs);
                    showToast("Rekap absensi berhasil diimpor", "Berhasil");
                };
                reader.readAsBinaryString(file); e.target.value = null;
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="flex flex-col gap-4 print-hidden">
                        <div className="flex flex-wrap justify-between gap-4 items-center">
                            <h2 className="text-2xl font-bold">Rekap Absensi Harian</h2>
                            <div className="flex gap-2">
                                <input type="date" value={dateStr} onChange={e=>setDateStr(e.target.value)} className="border-2 p-2.5 rounded-xl text-sm font-bold bg-white outline-none focus:border-blue-500" />
                                <button onClick={() => setShowScanner(true)} className={`${theme.bg} ${theme.hover} text-white px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 shadow-md transition`}><i className="fa-solid fa-qrcode"></i> Scan QR</button>
                            </div>
                        </div>
                        <div className="bg-white p-4 rounded-xl border shadow-sm flex flex-wrap items-center gap-3">
                            <span className="text-sm font-bold text-slate-600"><i className="fa-solid fa-file-excel mr-2 text-emerald-600"></i>Rekap:</span>
                            <button onClick={() => exportAbsensi(1)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold transition">1 Bulan</button>
                            <button onClick={() => exportAbsensi(3)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold transition">3 Bulan</button>
                            <button onClick={() => exportAbsensi(6)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-bold transition">6 Bulan</button>
                            <div className="flex-1"></div>
                            <button onClick={() => document.getElementById('up-abs').click()} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold transition"><i className="fa-solid fa-upload mr-2"></i>Import Excel</button>
                            <input type="file" id="up-abs" accept=".xlsx" className="hidden" onChange={importAbsensi} />
                        </div>
                    </div>

                    {showScanner && (
                        <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 print-hidden fade-in">
                            <div className="bg-white p-6 rounded-3xl w-full max-w-sm shadow-2xl relative overflow-hidden">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="font-black text-xl">Scan QR Siswa</h3>
                                    <button onClick={() => setShowScanner(false)} className="text-slate-400 hover:text-slate-800"><i className="fa-solid fa-xmark text-2xl"></i></button>
                                </div>
                                <div className="w-full aspect-square bg-slate-900 rounded-2xl flex items-center justify-center relative overflow-hidden mb-6 border-4 border-slate-200 shadow-inner">
                                    <i className="fa-solid fa-camera text-slate-600 text-6xl"></i>
                                    <div className="scan-line"></div>
                                </div>
                                <form onSubmit={handleScan}>
                                    <input autoFocus ref={scanRef} type="text" value={scanInput} onChange={e=>setScanInput(e.target.value)} placeholder="Tembak alat scan ke sini (Ketik NISN)" className="w-full border-2 border-slate-200 p-4 rounded-xl text-center font-bold outline-none focus:border-blue-500 bg-slate-50" />
                                </form>
                            </div>
                        </div>
                    )}

                    <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <table className="w-full text-left text-sm print-border-black">
                            <thead className="bg-slate-50 border-b">
                                <tr><th className="p-4 font-bold">Nama Siswa</th><th className="p-4 text-center font-bold">Status Kehadiran ({dateStr})</th></tr>
                            </thead>
                            <tbody className="divide-y">
                                {students.map(s => {
                                    const currentStatus = absensi[dateStr] && absensi[dateStr][s.id] ? absensi[dateStr][s.id] : null;
                                    return (
                                        <tr key={s.id}>
                                            <td className="p-4 font-bold text-slate-800">{s.nama}</td>
                                            <td className="p-4">
                                                <div className="flex justify-center gap-2">
                                                    {['Hadir', 'Sakit', 'Izin', 'Alpa'].map(st => (
                                                        <button key={st} onClick={() => handleStatus(s.id, st)}
                                                            className={`px-4 py-1.5 rounded-lg text-xs font-bold border transition ${currentStatus === st ? `${theme.bg} text-white border-transparent shadow-md` : 'bg-white text-slate-500 hover:bg-slate-100'}`}>{st}</button>
                                                    ))}
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function LegerView({ data, updateData, theme, showToast, activeRole, showConfirm }) {
            const { students, leger, legerCols } = data;
            const [isEditCols, setIsEditCols] = useState(false);
            
            const defaultColumns = activeRole === 'guru_mapel' 
                ? ['Tugas 1', 'Tugas 2', 'UH 1', 'UTS', 'UAS'] 
                : ['MTK', 'IPA', 'IPS', 'B.IND', 'B.ING', 'PKN', 'AGAMA'];
            
            const columns = legerCols || defaultColumns;

            const handleChange = (id, m, val) => {
                const updated = Object.assign({}, leger);
                if (!updated[id]) updated[id] = {};
                updated[id][m] = val;
                updateData('leger', updated);
            };

            const handleAddCol = () => {
                const newCol = prompt("Masukkan nama Mapel / Tugas baru:");
                if(newCol && newCol.trim()) {
                    if(columns.includes(newCol.trim())) return showToast("Nama tersebut sudah ada!", "Gagal");
                    updateData('legerCols', [...columns, newCol.trim()]);
                }
            };

            const handleEditCol = (idx) => {
                const oldName = columns[idx];
                const newName = prompt("Ubah nama Mapel / Tugas:", oldName);
                if(newName && newName.trim() && newName.trim() !== oldName) {
                    if(columns.includes(newName.trim())) return showToast("Nama tersebut sudah ada!", "Gagal");
                    
                    const newCols = [...columns];
                    newCols[idx] = newName.trim();
                    
                    const newLeger = Object.assign({}, leger);
                    Object.keys(newLeger).forEach(studentId => {
                        if (newLeger[studentId][oldName] !== undefined) {
                            newLeger[studentId][newName.trim()] = newLeger[studentId][oldName];
                            delete newLeger[studentId][oldName];
                        }
                    });
                    
                    updateData('legerCols', newCols);
                    updateData('leger', newLeger);
                }
            };

            const handleDeleteCol = (idx) => {
                const colName = columns[idx];
                showConfirm(`Hapus kolom "${colName}"? Semua nilai pada kolom ini akan ikut terhapus.`, () => {
                    const newCols = columns.filter((_, i) => i !== idx);
                    const newLeger = Object.assign({}, leger);
                    Object.keys(newLeger).forEach(studentId => {
                        if (newLeger[studentId][colName] !== undefined) {
                            delete newLeger[studentId][colName];
                        }
                    });
                    updateData('legerCols', newCols);
                    updateData('leger', newLeger);
                });
            };

            const exportExcel = () => {
                const exData = students.map(s => {
                    const row = { NISN: s.nisn, 'Nama Siswa': s.nama };
                    columns.forEach(m => row[m] = leger[s.id] && leger[s.id][m] ? leger[s.id][m] : '');
                    return row;
                });
                const ws = XLSX.utils.json_to_sheet(exData);
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, activeRole === 'guru_mapel' ? "Buku_Nilai" : "Leger_Nilai");
                XLSX.writeFile(wb, activeRole === 'guru_mapel' ? "Buku_Nilai_Mapel.xlsx" : "Leger_Nilai.xlsx");
            };

            const importExcel = (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, {type: 'binary'});
                    const rowData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    
                    if(rowData.length > 0) {
                        const importedCols = Object.keys(rowData[0]).filter(k => k !== 'NISN' && k !== 'Nama Siswa' && k !== 'Total');
                        updateData('legerCols', importedCols);
                        
                        const newLeger = Object.assign({}, leger);
                        rowData.forEach(row => {
                            const std = students.find(s => s.nisn == row.NISN);
                            if(std) {
                                if(!newLeger[std.id]) newLeger[std.id] = {};
                                importedCols.forEach(m => { if(row[m] !== undefined && row[m] !== '') newLeger[std.id][m] = row[m]; });
                            }
                        });
                        updateData('leger', newLeger);
                        showToast("Kolom dan Nilai berhasil disesuaikan mengikuti file Excel!", "Sukses");
                    }
                };
                reader.readAsBinaryString(file); e.target.value = null;
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="flex flex-wrap justify-between gap-4 items-center print-hidden">
                        <h2 className="text-2xl font-bold">{activeRole === 'guru_mapel' ? 'Buku Nilai Mata Pelajaran' : 'Leger Nilai Kelas'}</h2>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={() => setIsEditCols(!isEditCols)} className={`${isEditCols ? 'bg-slate-500 hover:bg-slate-600' : 'bg-amber-500 hover:bg-amber-600'} text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition flex items-center gap-2`}>
                                <i className={`fa-solid ${isEditCols ? 'fa-check' : 'fa-pen-to-square'}`}></i> {isEditCols ? 'Selesai Edit' : 'Edit Kolom'}
                            </button>
                            {isEditCols ? (
                                <button onClick={handleAddCol} className={`bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm transition flex items-center gap-2`}>
                                    <i className="fa-solid fa-plus"></i> Tambah Kolom
                                </button>
                            ) : (
                                <ExcelButtons onExport={exportExcel} onImport={importExcel} currentTheme={theme} />
                            )}
                        </div>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border overflow-x-auto print-w-full">
                        <table className="w-full text-left text-sm print-border-black print-w-full">
                            <thead className="bg-slate-50 border-b">
                                <tr>
                                    <th className="p-3 border-r font-bold w-48 align-middle">Nama Siswa</th>
                                    {columns.map((m, i) => (
                                        <th key={m} className="p-3 text-center border-r font-bold w-24 min-w-[80px] align-middle">
                                            <span className="block truncate">{m}</span>
                                            {isEditCols && (
                                                <div className="print-hidden flex justify-center gap-1 mt-2">
                                                    <button onClick={() => handleEditCol(i)} className="text-blue-500 bg-blue-50 hover:bg-blue-200 p-1.5 rounded-md text-xs transition" title="Ubah Nama"><i className="fa-solid fa-pen"></i></button>
                                                    <button onClick={() => handleDeleteCol(i)} className="text-rose-500 bg-rose-50 hover:bg-rose-200 p-1.5 rounded-md text-xs transition" title="Hapus Kolom"><i className="fa-solid fa-trash-can"></i></button>
                                                </div>
                                            )}
                                        </th>
                                    ))}
                                    <th className="p-3 text-center font-bold w-20 align-middle">Total</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {students.map(s => {
                                    const nilai = leger[s.id] || {};
                                    const total = columns.reduce((sum, m) => sum + (Number(nilai[m]) || 0), 0);
                                    return (
                                        <tr key={s.id} className="hover:bg-blue-50/30">
                                            <td className="p-3 border-r font-bold text-slate-700 truncate">{s.nama}</td>
                                            {columns.map(m => (
                                                <td key={m} className="border-r p-0 relative">
                                                    <input type="number" value={nilai[m] || ''} onChange={e=>handleChange(s.id, m, e.target.value)} className="w-full h-full p-3 text-center bg-transparent outline-none focus:bg-blue-50 focus:ring-inset focus:ring-2 focus:ring-blue-500 print-hidden" placeholder="-" />
                                                    <span className="hidden print:block text-center">{nilai[m] || '-'}</span>
                                                </td>
                                            ))}
                                            <td className="p-3 text-center font-black text-slate-800 bg-slate-50">{total}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function JadwalView({ data, updateData, theme, showToast }) {
            const { jadwal } = data;
            const defaultJam = ['07:00-07:45', '07:45-08:30', '08:30-09:15', '09:15-09:45 (Istirahat)', '09:45-10:30', '10:30-11:15', '11:15-12:00'];
            const jam = jadwal.times || defaultJam;
            const hari = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat'];

            const handleChange = (h, i, val) => {
                const updated = Object.assign({}, jadwal);
                updated[`${h}_${i}`] = val;
                updateData('jadwal', updated);
            };

            const handleTimeChange = (i, val) => {
                const updated = Object.assign({}, jadwal);
                const newTimes = [...jam];
                newTimes[i] = val;
                updated.times = newTimes;
                updateData('jadwal', updated);
            };

            const addRow = () => {
                const updated = Object.assign({}, jadwal);
                updated.times = [...jam, 'Jam Baru'];
                updateData('jadwal', updated);
            };

            const removeRow = (idx) => {
                const updated = Object.assign({}, jadwal);
                updated.times = jam.filter((_, i) => i !== idx);
                const newJadwal = { times: updated.times };
                hari.forEach(h => {
                    let newIdx = 0;
                    for (let i = 0; i < jam.length; i++) {
                        if (i !== idx) {
                            if (updated[`${h}_${i}`]) {
                                newJadwal[`${h}_${newIdx}`] = updated[`${h}_${i}`];
                            }
                            newIdx++;
                        }
                    }
                });
                updateData('jadwal', newJadwal);
            };

            const exportExcel = () => {
                const exData = jam.map((j, i) => {
                    const row = { Waktu: j };
                    hari.forEach(h => row[h] = jadwal[`${h}_${i}`] || (j.toLowerCase().includes('istirahat') ? 'ISTIRAHAT' : ''));
                    return row;
                });
                const ws = XLSX.utils.json_to_sheet(exData);
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Jadwal");
                XLSX.writeFile(wb, "Jadwal_Pelajaran.xlsx");
            };

            const importExcel = (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, {type: 'binary'});
                    const rowData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    const newJad = {};
                    
                    const importedTimes = rowData.map(row => row['Waktu'] || '00:00-00:00');
                    newJad.times = importedTimes;
                    
                    rowData.forEach((row, i) => {
                        hari.forEach(h => { if(row[h] && row[h] !== 'ISTIRAHAT') newJad[`${h}_${i}`] = row[h]; });
                    });
                    updateData('jadwal', newJad);
                    showToast("Jam & Mapel berhasil diimpor mengikuti format Excel!", "Sukses");
                };
                reader.readAsBinaryString(file); e.target.value = null;
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="flex flex-wrap justify-between gap-4 items-center print-hidden">
                        <h2 className="text-2xl font-bold">Jadwal Pelajaran Interaktif</h2>
                        <ExcelButtons onExport={exportExcel} onImport={importExcel} currentTheme={theme} />
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border overflow-x-auto">
                        <table className="w-full text-center text-sm table-fixed print-border-black">
                            <thead className="bg-slate-50 border-b">
                                <tr>
                                    <th className="p-3 border-r w-40">Waktu</th>
                                    {hari.map(h => <th key={h} className="p-3 border-r">{h}</th>)}
                                    <th className="p-3 w-16 print-hidden">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {jam.map((j, i) => {
                                    const isRest = j.toLowerCase().includes('istirahat');
                                    return (
                                        <tr key={i} className="hover:bg-slate-50 transition-colors">
                                            <td className="border-r relative bg-slate-50 p-0">
                                                <input type="text" value={j} onChange={e=>handleTimeChange(i, e.target.value)} className="w-full h-full p-4 text-center bg-transparent outline-none focus:bg-amber-50 focus:ring-inset focus:ring-2 focus:ring-amber-400 font-bold text-slate-600 text-xs print-hidden" placeholder="Waktu/Jam" />
                                                <span className="hidden print:block font-bold text-slate-600 text-xs p-3">{j}</span>
                                            </td>
                                            {isRest ? (
                                                <td colSpan="5" className="p-3 bg-slate-100 font-black tracking-widest text-slate-400">ISTIRAHAT</td>
                                            ) : hari.map(h => (
                                                <td key={h} className="border-r p-0 relative">
                                                    <input type="text" value={jadwal[`${h}_${i}`] || ''} onChange={e=>handleChange(h, i, e.target.value)} className="w-full h-full p-4 text-center bg-transparent outline-none focus:bg-amber-50 focus:ring-inset focus:ring-2 focus:ring-amber-400 font-bold text-slate-700 print-hidden uppercase" placeholder="Ketik Mapel..." />
                                                    <span className="hidden print:block uppercase font-bold p-3">{jadwal[`${h}_${i}`] || '-'}</span>
                                                </td>
                                            ))}
                                            <td className="p-2 print-hidden align-middle">
                                                <button onClick={() => removeRow(i)} className="text-rose-400 hover:text-rose-600 hover:bg-rose-50 p-2 rounded-lg transition" title="Hapus Baris">
                                                    <i className="fa-solid fa-trash-can"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                    <div className="print-hidden flex justify-center">
                        <button onClick={addRow} className={`px-6 py-2.5 rounded-xl border-2 border-dashed ${theme.text} ${theme.border} hover:bg-slate-50 font-bold text-sm transition flex items-center gap-2`}>
                            <i className="fa-solid fa-plus"></i> Tambah Baris Waktu
                        </button>
                    </div>
                </div>
            );
        }

        function GenericTable({ title, fields, dataKey, dataState, updateData, students, theme, showConfirm, showExcel }) {
            const [form, setForm] = useState({});
            
            const handleSubmit = (e) => {
                e.preventDefault();
                updateData(dataKey, [...(dataState || []), Object.assign({}, form, {id: Date.now().toString()})]);
                setForm({});
            };
            
            const hapus = (id) => showConfirm('Hapus data ini?', () => updateData(dataKey, (dataState || []).filter(d => d.id !== id)));

            const exportExcel = () => {
                const exData = (dataState || []).map(d => {
                    const row = {};
                    fields.forEach(f => row[f.label] = d[f.key] || '');
                    return row;
                });
                const ws = XLSX.utils.json_to_sheet(exData);
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, title);
                XLSX.writeFile(wb, `${title.replace(/ /g, '_')}.xlsx`);
            };

            const importExcel = (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const wb = XLSX.read(evt.target.result, {type: 'binary'});
                    const rowData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                    
                    const newData = rowData.map((d,i) => {
                        const obj = { id: Date.now().toString() + i };
                        fields.forEach(f => obj[f.key] = d[f.label] || '');
                        return obj;
                    });
                    
                    updateData(dataKey, [...(dataState || []), ...newData]);
                    alert("Data berhasil diimpor!");
                };
                reader.readAsBinaryString(file); e.target.value = null;
            };

            return (
                <div className="space-y-6 fade-in">
                    <div className="flex justify-between items-center print-hidden">
                        <h2 className="text-2xl font-bold">{title}</h2>
                        {showExcel && <ExcelButtons onExport={exportExcel} onImport={importExcel} currentTheme={theme} />}
                    </div>
                    <form onSubmit={handleSubmit} className="bg-white p-6 rounded-2xl shadow-sm border print-hidden grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                        {fields.map(f => (
                            <div key={f.key} className={f.full ? 'md:col-span-4' : ''}>
                                <label className="block text-xs font-bold text-slate-600 mb-1">{f.label}</label>
                                {f.type === 'select-student' ? (
                                    <select required value={form[f.key]||''} onChange={e=>setForm(Object.assign({}, form, {[f.key]: e.target.value}))} className="w-full border p-2.5 rounded-xl text-sm outline-none">
                                        <option value="">-- Pilih Siswa --</option>
                                        {students.map(s => <option key={s.id} value={s.nama}>{s.nama}</option>)}
                                    </select>
                                ) : (
                                    <input required type={f.type||'text'} value={form[f.key]||''} onChange={e=>setForm(Object.assign({}, form, {[f.key]: e.target.value}))} className="w-full border p-2.5 rounded-xl text-sm outline-none" placeholder={f.placeholder}/>
                                )}
                            </div>
                        ))}
                        <button type="submit" className={`md:col-span-4 py-3 ${theme.bg} ${theme.hover} text-white rounded-xl text-sm font-bold shadow-md`}>Tambah Data</button>
                    </form>
                    <div className="bg-white rounded-2xl shadow-sm border overflow-hidden">
                        <table className="w-full text-left text-sm print-border-black">
                            <thead className="bg-slate-50 border-b">
                                <tr>
                                    {fields.map(f => <th key={f.key} className="p-4 font-bold">{f.label}</th>)}
                                    <th className="p-4 text-center font-bold print-hidden">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {(dataState || []).length === 0 ? <tr><td colSpan={fields.length + 1} className="p-4 text-center text-slate-400">Belum ada data.</td></tr> : (dataState || []).map((d, i) => (
                                    <tr key={i} className="hover:bg-slate-50">
                                        {fields.map(f => (
                                            <td key={f.key} className="p-4 font-medium">
                                                {f.isLink ? <a href={d[f.key]} target="_blank" className="text-blue-600 underline"><i className="fa-solid fa-link mr-1"></i>Buka Link</a> : d[f.key]}
                                            </td>
                                        ))}
                                        <td className="p-4 text-center print-hidden">
                                            <button onClick={()=>hapus(d.id)} className="text-rose-500 bg-rose-50 hover:bg-rose-100 p-2 rounded-lg transition"><i className="fa-solid fa-trash-can"></i></button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        function EkskulView(props) {
            return <GenericTable title="Data Ekstrakurikuler" showExcel={true} dataKey="ekskul" dataState={props.data.ekskul} fields={[{key:'siswa', label:'Nama Siswa', type:'select-student'}, {key:'kegiatan', label:'Kegiatan (Cth: Pramuka)'}, {key:'nilai', label:'Nilai / Predikat'}]} {...props} students={props.data.students}/>;
        }
        function KokurikulerView(props) {
            return <GenericTable title="Data Kokurikuler / Proyek (P5)" showExcel={true} dataKey="kokurikuler" dataState={props.data.kokurikuler} fields={[{key:'siswa', label:'Nama Siswa', type:'select-student'}, {key:'tema', label:'Tema / Topik (Cth: Kearifan Lokal)'}, {key:'kegiatan', label:'Kegiatan Proyek'}, {key:'nilai', label:'Catatan / Predikat'}]} {...props} students={props.data.students}/>;
        }
        function HomeVisitView(props) {
            return <GenericTable title="Catatan Home Visit" dataKey="homevisit" dataState={props.data.homevisit} fields={[{key:'tanggal', label:'Tanggal', type:'date'}, {key:'siswa', label:'Siswa', type:'select-student'}, {key:'kasus', label:'Masalah / Tujuan', full:true}, {key:'hasil', label:'Hasil Kesepakatan', full:true}]} {...props} students={props.data.students}/>;
        }
        function KontakView(props) {
            return <GenericTable title="Kontak & Grup Wali Murid" dataKey="kontak" dataState={props.data.kontak} fields={[{key:'nama', label:'Nama Orang Tua/Grup'}, {key:'nomor', label:'Nomor WhatsApp (Cth: 6281...)'}, {key:'keterangan', label:'Keterangan (Ortu Siswa X)'}]} {...props} students={props.data.students}/>;
        }
        function TugasView(props) {
            return <GenericTable title="Manajemen Tugas & Google Drive" dataKey="tugas" dataState={props.data.tugas} fields={[{key:'mapel', label:'Mata Pelajaran'}, {key:'judul', label:'Judul Tugas'}, {key:'link', label:'Link Google Drive Folder', isLink:true}]} {...props} students={props.data.students}/>;
        }

        // ==========================================
        // UPDATE FITUR AI MENGGUNAKAN MODEL TERBARU
        // ==========================================
        function PerangkatView(props) {
            const { theme, showToast, settings } = props;
            const [activeSub, setActiveSub] = useState('ai'); 
            
            const [aiPrompt, setAiPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiResult, setAiResult] = useState('');

            const [lkpdForm, setLkpdForm] = useState({ mapel: '', kelas: '', topik: '' });
            const [lkpdList, setLkpdList] = useState([]);
            const [isGeneratingLkpd, setIsGeneratingLkpd] = useState(false);

            // MENGGUNAKAN gemini-1.5-flash-latest ATAU gemini-pro AGAR BEBAS ERROR
            const MODEL_NAME = "gemini-pro";

            const generateAI = async () => {
                if (!aiPrompt.trim()) return showToast("Mohon ketik materi atau topik terlebih dahulu!", "Peringatan");
                
                const apiKey = settings?.apiKey?.trim();
                if (!apiKey) {
                    return showToast("Kunci Akses AI (API Key) belum diisi! Silakan buka menu 'Pengaturan Tema'.", "Error");
                }

                setIsGenerating(true);
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
                    
                    const payload = {
                        contents: [{ role: "user", parts: [{ text: `Kamu adalah asisten guru. Buatkan kerangka perangkat pembelajaran (Modul Ajar / RPP) yang sangat terstruktur, praktis dan detail untuk topik berikut: ${aiPrompt}. Gunakan bahasa Indonesia baku dan format yang rapi.` }] }]
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const result = await response.json();
                    
                    if (!response.ok) {
                        console.error("API Error:", result);
                        throw new Error(result.error?.message || "Terjadi kesalahan pada server AI.");
                    }

                    if (result.candidates && result.candidates.length > 0 && result.candidates[0].content) {
                        setAiResult(result.candidates[0].content.parts[0].text);
                        showToast("Perangkat pembelajaran berhasil dibuat!", "Sukses");
                    } else {
                        throw new Error("Respons dari server tidak sesuai format yang diharapkan.");
                    }
                } catch (e) {
                    console.error("AI Fetch Error: ", e);
                    showToast(`Gagal: ${e.message}`, "Error");
                }
                setIsGenerating(false);
            };

            const generateLkpd = async () => {
                if (!lkpdForm.mapel || !lkpdForm.kelas) return showToast("Mapel dan Kelas wajib diisi untuk menghasilkan LKPD!", "Peringatan");
                
                const apiKey = settings?.apiKey?.trim();
                if (!apiKey) {
                    return showToast("Kunci Akses AI (API Key) belum diisi! Silakan buka menu 'Pengaturan Tema'.", "Error");
                }

                setIsGeneratingLkpd(true);
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
                    
                    const payload = {
                        contents: [{ role: "user", parts: [{ text: `Instruksi Sistem: Anda adalah pembuat LKPD. Selalu balas HANYA dengan format JSON array valid, tanpa penjelasan teks apapun sebelum/sesudahnya.\n\nTugas: Buatkan 4 rekomendasi Lembar Kerja Peserta Didik (LKPD) yang kreatif dan memicu nalar kritis siswa untuk mata pelajaran ${lkpdForm.mapel} ${lkpdForm.kelas} dengan topik/materi ${lkpdForm.topik || 'yang sesuai kurikulum'}. Berikan respons DALAM FORMAT JSON ARRAY dengan struktur persis seperti ini: [{"judul": "Judul LKPD", "deskripsi": "Deskripsi singkat", "konten_lengkap": "Langkah kerja detail"}]` }] }]
                    };

                    const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const result = await response.json();
                    
                    if (!response.ok) {
                        console.error("API Error:", result);
                        throw new Error(result.error?.message || "Terjadi kesalahan pada server AI.");
                    }

                    if (result.candidates && result.candidates[0].content) {
                        let jsonStr = result.candidates[0].content.parts[0].text;
                        jsonStr = jsonStr.replace(/```json/g, '').replace(/```/g, '').trim();
                        try {
                            const parsed = JSON.parse(jsonStr);
                            setLkpdList(parsed);
                            showToast("Rekomendasi LKPD berhasil dibuat AI!", "Sukses");
                        } catch(err) {
                            console.error("Parse Error:", err, jsonStr);
                            const match = jsonStr.match(/\[[\s\S]*\]/);
                            if(match) {
                                setLkpdList(JSON.parse(match[0]));
                                showToast("Rekomendasi LKPD berhasil dibuat AI!", "Sukses");
                            } else {
                                throw new Error("Gagal membaca data dari AI. Format tidak sesuai.");
                            }
                        }
                    } else {
                        throw new Error("Gagal mendapat respons AI yang valid.");
                    }
                } catch (e) {
                    console.error("AI LKPD Error: ", e);
                    showToast(`Error: ${e.message}`, "Error");
                }
                setIsGeneratingLkpd(false);
            };

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    showToast('Teks berhasil disalin ke clipboard!', 'Sukses');
                } catch (err) {
                    showToast('Gagal menyalin teks.', 'Error');
                }
                document.body.removeChild(textArea);
            };

            const tpls = [
                {t:'Sertifikat Penghargaan', c:'bg-blue-100', ic:'fa-award'}, 
                {t:'Jadwal Piket Kelas', c:'bg-emerald-100', ic:'fa-broom'}, 
                {t:'Struktur Organisasi', c:'bg-amber-100', ic:'fa-sitemap'}
            ];
            
            const handleDownloadLKPD = (lkpd) => {
                const fileContent = `=======================================\nLEMBAR KERJA PESERTA DIDIK (LKPD)\n=======================================\n\nMata Pelajaran : ${lkpdForm.mapel || '-'}\nSasaran Kelas  : ${lkpdForm.kelas || '-'}\nJudul LKPD     : ${lkpd.judul}\n\n=======================================\n\nDESKRIPSI AKTIVITAS:\n${lkpd.deskripsi}\n\n=======================================\n\nISI / LANGKAH KERJA LKPD:\n${lkpd.konten_lengkap}`;
                
                const element = document.createElement("a");
                const file = new Blob([fileContent], {type: 'text/plain'});
                element.href = URL.createObjectURL(file);
                element.download = `LKPD_${lkpd.judul.replace(/[^a-zA-Z0-9]/g, '_')}.txt`;
                document.body.appendChild(element); 
                element.click();
                document.body.removeChild(element);
            };

            return (
                <div className="space-y-6 fade-in print-hidden">
                    <div className="flex border-b border-slate-200 gap-4 mb-6 overflow-x-auto">
                        <button onClick={()=>setActiveSub('ai')} className={`pb-3 font-bold text-sm transition-colors border-b-2 whitespace-nowrap ${activeSub === 'ai' ? `${theme.text} ${theme.border}` : 'border-transparent text-slate-400 hover:text-slate-700'}`}><i className="fa-solid fa-robot mr-2"></i>AI Pembuat Modul Ajar</button>
                        <button onClick={()=>setActiveSub('template')} className={`pb-3 font-bold text-sm transition-colors border-b-2 whitespace-nowrap ${activeSub === 'template' ? `${theme.text} ${theme.border}` : 'border-transparent text-slate-400 hover:text-slate-700'}`}><i className="fa-solid fa-file-signature mr-2"></i>AI Pembuat LKPD & Canva</button>
                        <button onClick={()=>setActiveSub('drive')} className={`pb-3 font-bold text-sm transition-colors border-b-2 whitespace-nowrap ${activeSub === 'drive' ? `${theme.text} ${theme.border}` : 'border-transparent text-slate-400 hover:text-slate-700'}`}><i className="fa-brands fa-google-drive mr-2"></i>Arsip File (G-Drive)</button>
                    </div>

                    {activeSub === 'ai' && (
                        <div className="bg-white p-6 rounded-2xl shadow-sm border space-y-4 fade-in">
                            <h3 className="text-xl font-bold text-slate-800 flex items-center gap-2"><i className={`fa-solid fa-robot ${theme.text}`}></i> Asisten Pembuat Perangkat Mengajar</h3>
                            <p className="text-sm text-slate-500 mb-2">Ketikkan topik atau materi pelajaran (Cth: <i>Modul Ajar IPAS Kelas 5 Bab Ekosistem</i>), AI akan merumuskan capaian pembelajaran, langkah kerja, hingga rubrik penilaian lengkap.</p>
                            
                            <textarea
                                value={aiPrompt} 
                                onChange={e => setAiPrompt(e.target.value)}
                                className="w-full border-2 border-slate-200 p-4 rounded-xl outline-none focus:border-blue-500 text-sm font-medium"
                                rows="3" 
                                placeholder="Coba ketik topik perangkat pembelajaran di sini..."
                            ></textarea>
                            
                            <button onClick={generateAI} disabled={isGenerating} className={`px-6 py-3 ${theme.bg} ${theme.hover} text-white font-bold rounded-xl flex items-center gap-2 transition disabled:opacity-50 disabled:cursor-not-allowed`}>
                                {isGenerating ? <i className="fa-solid fa-spinner fa-spin text-lg"></i> : <i className="fa-solid fa-wand-magic-sparkles text-lg"></i>}
                                {isGenerating ? 'AI Sedang Bekerja...' : 'Buat Modul Sekarang'}
                            </button>

                            {aiResult && (
                                <div className="mt-8 border-t pt-6 fade-in">
                                    <div className="flex justify-between items-center mb-4">
                                        <h4 className="font-bold text-lg text-slate-800">Hasil Kerangka Perangkat:</h4>
                                        <button onClick={() => copyToClipboard(aiResult)} className="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm flex items-center gap-2">
                                            <i className="fa-regular fa-copy"></i> Salin Teks
                                        </button>
                                    </div>
                                    <div className="bg-slate-50 p-6 rounded-xl border-2 border-slate-100 whitespace-pre-wrap text-sm text-slate-700 leading-relaxed max-h-[500px] overflow-y-auto shadow-inner font-serif">
                                        {aiResult}
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {activeSub === 'template' && (
                        <div className="space-y-10 fade-in">
                            <div className="bg-gradient-to-r from-slate-50 to-blue-50 p-6 rounded-2xl border border-blue-100 shadow-sm">
                                <div className="flex items-center gap-3 mb-4">
                                    <i className={`fa-solid fa-file-pen text-3xl ${theme.text}`}></i>
                                    <div>
                                        <h2 className="text-xl font-bold text-slate-800">Bank LKPD Berbasis AI (Kustom)</h2>
                                        <p className="text-slate-500 text-sm">AI Gemini akan membuatkan ide aktivitas dan isi lembar tugas yang spesifik untuk siswa Anda.</p>
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                                    <input type="text" placeholder="Mapel (Cth: Matematika)" value={lkpdForm.mapel} onChange={e=>setLkpdForm(Object.assign({}, lkpdForm, {mapel: e.target.value}))} className="p-3 rounded-xl border-2 border-slate-200 outline-none focus:border-blue-500 font-medium" />
                                    <input type="text" placeholder="Kelas (Cth: Kelas 4 Fase B)" value={lkpdForm.kelas} onChange={e=>setLkpdForm(Object.assign({}, lkpdForm, {kelas: e.target.value}))} className="p-3 rounded-xl border-2 border-slate-200 outline-none focus:border-blue-500 font-medium" />
                                    <input type="text" placeholder="Topik Khusus (Opsional)" value={lkpdForm.topik} onChange={e=>setLkpdForm(Object.assign({}, lkpdForm, {topik: e.target.value}))} className="p-3 rounded-xl border-2 border-slate-200 outline-none focus:border-blue-500 font-medium" />
                                </div>
                                
                                <button onClick={generateLkpd} disabled={isGeneratingLkpd} className={`w-full py-3 ${theme.bg} ${theme.hover} text-white font-bold rounded-xl transition disabled:opacity-50 flex items-center justify-center gap-2 shadow-md`}>
                                    {isGeneratingLkpd ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-brain"></i>}
                                    {isGeneratingLkpd ? 'Memikirkan Aktivitas Belajar...' : 'Minta AI Buat 4 Rekomendasi LKPD'}
                                </button>
                                
                                {lkpdList.length > 0 && (
                                    <div className="mt-8 grid grid-cols-1 lg:grid-cols-2 gap-4 fade-in">
                                        {lkpdList.map((lkpd, i) => (
                                            <div key={i} className="bg-white border-2 border-slate-200 rounded-xl p-5 hover:border-blue-300 transition flex flex-col h-full shadow-sm">
                                                <div className={`w-10 h-10 rounded-lg ${theme.bg} bg-opacity-10 ${theme.text} flex items-center justify-center mb-3`}>
                                                    <i className="fa-solid fa-clipboard-check text-xl"></i>
                                                </div>
                                                <h3 className="font-bold text-slate-800 text-lg leading-tight mb-2">{lkpd.judul}</h3>
                                                <p className="text-sm font-medium text-slate-500 mb-6 flex-grow">{lkpd.deskripsi}</p>
                                                <div className="flex gap-2 mt-auto">
                                                    <button onClick={() => showToast(lkpd.konten_lengkap, lkpd.judul)} className="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg text-sm transition">Pratinjau</button>
                                                    <button onClick={() => handleDownloadLKPD(lkpd)} className={`flex-1 py-2 ${theme.bg} hover:brightness-90 text-white font-bold rounded-lg text-sm transition flex justify-center items-center gap-2`}>
                                                        <i className="fa-solid fa-download"></i> Simpan
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="border-t pt-8">
                                <h2 className="text-xl font-bold mb-4 flex items-center gap-2 text-slate-800"><i className="fa-solid fa-palette text-blue-500"></i> Template Administrasi Canva</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    {tpls.map((t,i) => (
                                        <div key={i} className="bg-white border-2 border-slate-100 rounded-2xl overflow-hidden hover:shadow-lg transition">
                                            <div className={`h-32 ${t.c} flex items-center justify-center`}><i className={`fa-solid ${t.ic} text-5xl opacity-30`}></i></div>
                                            <div className="p-4 text-center">
                                                <h3 className="font-bold text-sm mb-3 text-slate-700">{t.t}</h3>
                                                <button onClick={()=>window.open('https://canva.com','_blank')} className={`w-full py-2 ${theme.bg} text-white font-bold rounded-xl text-sm hover:brightness-90`}>Buka Studio Canva</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {activeSub === 'drive' && (
                        <div className="fade-in">
                            <GenericTable 
                                title="Arsip Folder/File G-Drive Guru" 
                                dataKey="perangkat" 
                                dataState={props.data.perangkat} 
                                fields={[
                                    {key:'judul', label:'Judul Dokumen / Folder (Cth: RPP Genap)'}, 
                                    {key:'kelas', label:'Keterangan (Cth: Fase B)'}, 
                                    {key:'link', label:'Link Dokumen (Google Drive/Docs)', isLink:true}
                                ]} 
                                {...props} 
                            />
                        </div>
                    )}
                </div>
            );
        }

        function PengaturanView({ appData, updateSettings, theme, showToast, currentUser, deleteUser }) {
            const [form, setForm] = useState(appData.settings);
            const save = () => { updateSettings(form); showToast("Pengaturan berhasil disimpan!", "Sukses"); };
            return (
                <div className="space-y-6 max-w-xl fade-in print-hidden">
                    <h2 className="text-2xl font-bold">Pengaturan Aplikasi</h2>
                    <div className="bg-white p-8 rounded-3xl shadow-sm border space-y-6">
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-3">Tema Warna UI</label>
                            <div className="flex gap-4">
                                {['blue', 'emerald', 'indigo', 'rose'].map(c => (
                                    <button key={c} onClick={()=>setForm(Object.assign({}, form, {theme: c}))} className={`w-12 h-12 rounded-full flex items-center justify-center transition ${themes[c].bg} ${form.theme===c ? 'ring-4 ring-offset-2 ring-slate-300 scale-110 shadow-lg' : 'hover:scale-105'}`}>
                                        {form.theme===c && <i className="fa-solid fa-check text-white"></i>}
                                    </button>
                                ))}
                            </div>
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">Nama Sekolah / Instansi</label>
                            <input type="text" value={form.schoolName} onChange={e=>setForm(Object.assign({}, form, {schoolName: e.target.value}))} className="w-full border-2 p-3 rounded-xl font-bold" />
                        </div>
                        <div>
                            <label className="block text-sm font-bold text-slate-700 mb-1">URL Logo Resmi</label>
                            <input type="text" value={form.logo} onChange={e=>setForm(Object.assign({}, form, {logo: e.target.value}))} className="w-full border-2 p-3 rounded-xl" placeholder="https://..." />
                        </div>
                        <div className="p-4 bg-blue-50 border border-blue-200 rounded-2xl">
                            <label className="block text-sm font-bold text-blue-900 mb-1"><i className="fa-solid fa-key mr-2"></i>Kunci Akses AI (API Key Gemini)</label>
                            <input type="password" value={form.apiKey || ''} onChange={e=>setForm(Object.assign({}, form, {apiKey: e.target.value}))} className="w-full border-2 border-blue-300 p-3 rounded-xl bg-white focus:border-blue-600 outline-none" placeholder="Ketik/Paste API Key Google Gemini..." />
                            <p className="text-xs text-blue-700 mt-2 font-medium">Dapatkan API Key secara gratis dari <a href="https://aistudio.google.com/app/apikey" target="_blank" className="underline font-bold hover:text-blue-900">Google AI Studio</a>. Kunci ini wajib diisi agar AI bisa membalas permintaan Anda.</p>
                        </div>
                        <button onClick={save} className={`w-full py-4 ${theme.bg} ${theme.hover} text-white font-bold rounded-xl shadow-lg`}>Simpan Pengaturan</button>
                    </div>

                    {currentUser && currentUser.role === 'admin' && (
                        <div className="bg-white p-8 rounded-3xl shadow-sm border space-y-4 mt-6">
                            <h3 className="text-lg font-bold text-slate-800 border-b pb-2">Manajemen Akun Guru</h3>
                            <div className="space-y-3">
                                {appData.users.filter(u => u.role !== 'admin').length === 0 ? (
                                    <p className="text-sm text-slate-500">Belum ada akun guru yang terdaftar.</p>
                                ) : (
                                    appData.users.filter(u => u.role !== 'admin').map(u => (
                                        <div key={u.username} className="flex items-center justify-between bg-slate-50 p-3 rounded-xl border">
                                            <div>
                                                <p className="font-bold text-slate-700">{u.username}</p>
                                                <p className="text-xs text-slate-500 uppercase font-medium">{u.role === 'guru_mapel' ? `Mapel: ${u.mapelName || '-'}` : 'Wali Kelas'}</p>
                                            </div>
                                            <button onClick={() => deleteUser(u.username)} className="text-rose-500 hover:text-rose-700 bg-white hover:bg-rose-50 border p-2 rounded-lg shadow-sm transition" title="Hapus Akun">
                                                <i className="fa-solid fa-trash-can mr-1"></i> Hapus
                                            </button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Render ReactDOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
